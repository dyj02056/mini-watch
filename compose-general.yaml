name: m5d1-general
services:
  general-db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: general_db
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample-only-pass
    volumes:
    - general-data:/var/lib/postgresql/data
    - ./general/sql/docker-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
    - general-data-net
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U sample -d general_db
      interval: 3s
      timeout: 3s
      retries: 20
  general-api:
    build: ./general
    volumes:
    - classroom-logs:/classroom-logs
    - notice-state:/classroom-data
    environment:
      DB_HOST: general-db
      DB_PORT: '5432'
      DB_NAME: general_db
      DB_USER: sample
      DB_PASSWORD: sample-only-pass
      DB_SSLMODE: disable
      SECRET_KEY: sample-general-session-key-not-for-production
      MONITOR_URL: http://monitor-api:5000/api/events
      REQUEST_LOG_PATH: /classroom-logs/app.jsonl
      CLASSROOM_DATA_DIR: /classroom-data
      CLASSROOM_SERVER_ID: general-01
      EVENT_TOKEN: local-training-token-change-for-production
      SEED_CLASSROOM_ACCOUNTS: "true"
    depends_on:
      general-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
    - general-front-net
    - general-data-net
    - events-net
  file-sensor:
    build: ./sensor
    network_mode: none
    volumes:
    - notice-state:/classroom-data:ro
    - classroom-logs:/classroom-logs
    environment:
      CLASSROOM_DATA_DIR: /classroom-data
      CLASSROOM_LOG_DIR: /classroom-logs
      CLASSROOM_SERVER_ID: general-01
    depends_on:
      general-api:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, sensor.py, --healthcheck]
      interval: 3s
      timeout: 3s
      retries: 30
  general-gateway:
    image: nginx:1.28-alpine
    ports:
    - 127.0.0.1:8081:80
    volumes:
    - ./gateways/general.conf:/etc/nginx/conf.d/default.conf:ro
    - classroom-logs:/classroom-logs
    networks:
    - general-front-net
    depends_on:
    - general-api
volumes:
  general-data: {}
  notice-state:
    name: m5d1-notice-state
  classroom-logs:
    name: m5d1-classroom-logs
networks:
  general-front-net: {}
  general-data-net: {}
  events-net:
    external: true
    name: m5d1-events
